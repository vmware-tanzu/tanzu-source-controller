#@ load("@ytt:data", "data")

---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: #@ data.values.name + '.' + data.values.version
spec:
  refName: #@ data.values.name
  version: #@ data.values.version
  valuesSchema:
    openAPIv3:
      title: #@ data.values.name + '.' + data.values.version + ' values schema'
      properties:
        ca_cert_data:
          type: string
          description: "Optional: PEM Encoded certificate data for image registries with private CA."
          default: ""
        aws_iam_role_arn:
          type: string
          description: "Optional: The AWS IAM Role ARN to attach to the source controller service account"
          nullable: true
        #! type is inferred as string from default, so the value must be quoted
        #! (e.g. "0"), not bare 0, which ytt rejects on a type mismatch.
        maven_artifact_max_size:
          type: string
          description: "Maximum size of a MavenArtifact's downloaded file, and separately of its extracted contents; peak temporary disk usage can reach roughly twice this value. Applies only to MavenArtifact resources, not ImageRepository. Set to 0 to disable the limit."
          default: "500Mi"
  template:
    spec:
      fetch:
      - imgpkgBundle:
          image: #@ data.values.image
      template:
      - kbld:
          paths:
          - .imgpkg/images.yml
          - config/source-controller.yaml
      - ytt:
          paths:
          - "-"
          - bundle.yaml
      deploy:
      - kapp: {}
